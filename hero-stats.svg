<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img">
<style>
.bg{fill:#090c12}.card{fill:#111722;stroke:#283449;stroke-width:2}.red{fill:#e31b23}.blue{fill:#4d8dff}.white{fill:#f5f7fa}.muted{fill:#8d98a8}
.h{font:700 14px Arial;letter-spacing:3px}.n{font:700 42px Arial}.s{font:500 14px Arial;letter-spacing:1.5px}
.glow{animation:glow 2s ease-in-out infinite}@keyframes glow{50%{opacity:.45}}
</style>
<rect width="1200" height="300" rx="22" class="bg"/>
<text x="55" y="45" class="h red">HERO STATS</text>
<g transform="translate(45,70)">
<rect width="250" height="170" rx="16" class="card"/>
<text x="25" y="45" class="h muted">PUBLIC REPOS</text><text x="25" y="105" class="n white">8</text><text x="25" y="140" class="s muted">ACTIVE PROFILE</text>
</g>
<g transform="translate(325,70)">
<rect width="250" height="170" rx="16" class="card"/>
<text x="25" y="45" class="h muted">CONTRIBUTIONS</text><text x="25" y="105" class="n blue">87</text><text x="25" y="140" class="s muted">LAST YEAR</text>
</g>
<g transform="translate(605,70)">
<rect width="250" height="170" rx="16" class="card"/>
<text x="25" y="45" class="h muted">STARS</text><text x="25" y="105" class="n white">0</text><text x="25" y="140" class="s muted">PROFILE REPOS</text>
</g>
<g transform="translate(885,70)">
<rect width="250" height="170" rx="16" class="card"/>
<text x="25" y="45" class="h muted">FOCUS</text><text x="25" y="100" class="h white">FULL-STACK</text><text x="25" y="126" class="h white">DEVELOPMENT</text><circle cx="220" cy="142" r="6" class="red glow"/>
</g>
</svg>